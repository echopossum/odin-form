<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="reset.css">
    <link rel="stylesheet" href="style.css">
    <title>Odin Form</title>
</head>
<body>
    <div class="accent-image-container">
        <img class="accent-image" src="images/background-image.jpg" alt="pretty purple mountains" >
        <div class="heading-background">
            <img class="accent-logo" src="/images/bloodborne-logo.png" alt="bloodborne glyph">
            <p>POSSUM</p>
        </div>
        <p class="copywrite">Image found on the internet</p>
    </div>
    <div class="user-section">
        <div class="quote-container">
            <p>This is not a real online service! You know you need something</p>
            <p>like this in your life to help you realize your deepest dreams.</p>
            <p>Sign up <strong>now</strong> get started.</p>
            <p>You <strong>know</strong> you want to.</p>
        </div>
        <form action="#">
            <div class="fillable-section">
                <h2>Let's do this!</h2>
                <div class="field-section">
                    <label for="first-name">
                        <p>First Name</p>
                        <input type="text" id="first-name" name="first-name" required>
                    </label>
                    <label for="last-name">
                        <p>Last Name</p>
                        <input type="text" id="last-name" name="last-name" required>
                    </label>
                    <label for="email">
                        <p>Email</p>
                        <input type="email" id="email" name="email" required>
                    </label>
                    <label for="phone-number">
                        <p>Phone Number</p>
                        <input type="text" id="phone-number" name="phone-number">
                    </label>
                    <label for="password">
                        <p>Password</p>
                        <input type="password" id="password" name="password" required>
                    </label>
                    <label for="password-confirm">
                        <p>Confirm Password</p>
                        <input type="password" id="password-confirm" name="password-confirm" required>
                    </label>
                </div>
            </div>
            <div class="create-button-container">
                <button type="submit">Create Account</button>
                <span>Already have an account?</span>
                <a href="/">Log in</a>
            </div>
            
        </form>
    </div>
</body>
<script src="index.js"></script>
</html>
